
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Medical Chatbot</title>

    <!-- Markdown parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f8fafc;
            color: #0f172a;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            color: #2563eb;
            margin-bottom: 8px;
        }

        .header p {
            color: #64748b;
        }

        .chat-box {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            height: 550px;
            padding: 20px;
            overflow-y: auto;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .message {
            max-width: 85%;
            padding: 12px 15px;
            margin-bottom: 15px;
            border-radius: 10px;
            line-height: 1.6;
        }

        .user {
            margin-left: auto;
            background: #2563eb;
            color: white;
        }

        .bot {
            margin-right: auto;
            background: #f1f5f9;
            color: #0f172a;
        }

        .bot h1,
        .bot h2,
        .bot h3 {
            margin-top: 10px;
            margin-bottom: 8px;
        }

        .bot h1:first-child,
        .bot h2:first-child,
        .bot h3:first-child {
            margin-top: 0;
        }

        .bot p {
            margin-bottom: 10px;
        }

        .bot ul,
        .bot ol {
            margin-left: 22px;
            margin-bottom: 10px;
        }

        .bot li {
            margin-bottom: 5px;
        }

        .bot strong {
            font-weight: 700;
        }

        .bot em {
            font-style: italic;
        }

        .bot table {
            width: 100%;
            border-collapse: collapse;
            margin: 12px 0;
            background: white;
        }

        .bot th,
        .bot td {
            border: 1px solid #cbd5e1;
            padding: 8px;
            text-align: left;
        }

        .bot th {
            background: #e2e8f0;
            font-weight: bold;
        }

        .bot code {
            background: #e2e8f0;
            padding: 2px 5px;
            border-radius: 4px;
        }

        .input-area {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .input-area input {
            flex: 1;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        .input-area input:focus {
            border-color: #2563eb;
        }

        .input-area button {
            padding: 13px 22px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .input-area button:hover {
            background: #1d4ed8;
        }

        .input-area button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .loading {
            color: #64748b;
            font-style: italic;
        }

        @media (max-width: 600px) {

            .container {
                margin: 10px auto;
                padding: 10px;
            }

            .chat-box {
                height: 500px;
                padding: 12px;
            }

            .message {
                max-width: 95%;
            }

            .input-area {
                flex-direction: column;
            }

            .input-area button {
                width: 100%;
            }

            .bot table {
                font-size: 14px;
            }

            .bot th,
            .bot td {
                padding: 6px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>Medical Chatbot</h1>
            <p>Ask a medical information question</p>
        </div>

        <div class="chat-box" id="chatBox">

            <div class="message bot">
                Hello! How can I help you today?
            </div>

        </div>

        <div class="input-area">

            <input
                type="text"
                id="question"
                placeholder="Ask a medical question..."
                autocomplete="off"
            >

            <button id="sendButton">
                Send
            </button>

        </div>

    </div>


    <script>

        const questionInput = document.getElementById("question");

        const sendButton = document.getElementById("sendButton");

        const chatBox = document.getElementById("chatBox");


        async function sendMessage() {

            const question = questionInput.value.trim();

            if (!question) {
                return;
            }


            // Show user message

            const userMessage = document.createElement("div");

            userMessage.className = "message user";

            userMessage.textContent = question;

            chatBox.appendChild(userMessage);


            // Clear input

            questionInput.value = "";


            // Disable button

            sendButton.disabled = true;

            sendButton.textContent = "Sending...";


            // Loading message

            const loadingMessage = document.createElement("div");

            loadingMessage.className = "message bot loading";

            loadingMessage.textContent = "Thinking...";

            chatBox.appendChild(loadingMessage);


            chatBox.scrollTop = chatBox.scrollHeight;


            try {

                const response = await fetch(
                    "http://127.0.0.1:8000/chatbot?question=" +
                    encodeURIComponent(question),
                    {
                        method: "POST"
                    }
                );


                if (!response.ok) {

                    throw new Error(
                        "Server returned " + response.status
                    );

                }


                const data = await response.json();


                // Remove loading message

                loadingMessage.remove();


                // Create bot message

                const botMessage = document.createElement("div");

                botMessage.className = "message bot";


                /*
                    FastAPI returns:

                    return answer

                    Therefore data is the answer string.
                    
                    marked.parse() converts Markdown
                    into HTML.
                */

                botMessage.innerHTML = marked.parse(data);


                chatBox.appendChild(botMessage);


                chatBox.scrollTop = chatBox.scrollHeight;


            } catch (error) {

                loadingMessage.remove();


                const errorMessage = document.createElement("div");

                errorMessage.className = "message bot";

                errorMessage.textContent =
                    "Unable to connect to the medical chatbot. " +
                    "Please make sure FastAPI is running.";

                chatBox.appendChild(errorMessage);


                console.error(error);

            }


            // Enable button

            sendButton.disabled = false;

            sendButton.textContent = "Send";

            questionInput.focus();

        }


        // Send button

        sendButton.addEventListener(
            "click",
            sendMessage
        );


        // Press Enter to send

        questionInput.addEventListener(
            "keydown",
            function (event) {

                if (event.key === "Enter") {

                    sendMessage();

                }

            }
        );

    </script>

</body>

</html>
